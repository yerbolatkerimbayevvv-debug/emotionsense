# Только инфраструктура + ML: для локальной разработки Go-сервисов
# (api и worker запускаются через `go run` с хоста).
#
#   docker compose -f deploy/docker-compose.infra.yml up -d
#   make run-api   # в одном терминале
#   make run-worker  # в другом

name: emotionsense-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emotion
      POSTGRES_PASSWORD: emotion
      POSTGRES_DB: emotionsense
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotion -d emotionsense"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9094:9094"]

  ml:
    build:
      context: ..
      dockerfile: ml-service/Dockerfile
    ports: ["50051:50051"]
    volumes: [mlmodels:/models]

volumes:
  mlmodels:
