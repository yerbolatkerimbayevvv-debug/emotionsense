name: emotionsense

x-go-env: &go-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
  POSTGRES_DSN: postgres://emotion:emotion@postgres:5432/emotionsense?sslmode=disable
  REDIS_ADDR: redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET: faces
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: image.uploaded
  KAFKA_DLQ_TOPIC: image.failed
  KAFKA_CONSUMER_GROUP: emotion-workers
  ML_ADDR: ml:50051

services:
  # ---------- инфраструктура ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emotion
      POSTGRES_PASSWORD: emotion
      POSTGRES_DB: emotionsense
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotion -d emotionsense"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft-режим: без ZooKeeper
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
    ports: ["9094:9094"]
    volumes: [kafkadata:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Веб-интерфейс для Kafka: удобно показывать очередь на защите
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8090:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    profiles: [tools]

  # ---------- ML ----------
  ml:
    build:
      context: ..
      dockerfile: ml-service/Dockerfile
    environment:
      GRPC_PORT: 50051
      DETECTOR_BACKEND: opencv
    ports: ["50051:50051"]
    volumes: [mlmodels:/models]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc,sys; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch=grpc.insecure_channel('localhost:50051'); r=health_pb2_grpc.HealthStub(ch).Check(health_pb2.HealthCheckRequest(service=''),timeout=3); sys.exit(0 if r.status==1 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ---------- Go-сервисы ----------
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: api }
    environment:
      <<: *go-env
      HTTP_PORT: 8080
      POSTGRES_MIGRATE_ON_START: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: worker }
    environment:
      <<: *go-env
      HTTP_PORT: 8081
      POSTGRES_MIGRATE_ON_START: "false"
      WORKER_CONCURRENCY: 4
      WORKER_MAX_ATTEMPTS: 3
    depends_on:
      api: { condition: service_started }
      ml: { condition: service_started }
    deploy:
      replicas: 2   # демонстрация горизонтального масштабирования воркеров
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  kafkadata:
  mlmodels:
